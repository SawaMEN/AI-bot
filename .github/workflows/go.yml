name: Go native
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: bash -n install.sh
      - run: go mod tidy
      - run: gofmt -w go/*.go
      - run: go vet ./go/...
      - run: go test -count=1 -v ./go/...
      - run: go test -race -count=1 ./go/...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ai-bot-linux-amd64 ./go
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ai-bot-linux-arm64 ./go
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bot-go-linux
          path: dist/*
          retention-days: 30
